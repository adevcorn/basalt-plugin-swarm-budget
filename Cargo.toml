[package]
name = "basalt-plugin-swarm-budget"
version = "0.1.0"
edition = "2021"
description = "Budget-aware Swarm Strategy Plugin for Basalt: successive-halving orchestration with per-peer model routing and cost telemetry"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
basalt-plugin-sdk = { git = "https://github.com/adevcorn/basalt-plugin-sdk", tag = "v0.1.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
